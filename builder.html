<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill Details - Profile Craft Builder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/builder.css">
  <link rel="stylesheet" href="css/portfolio-templates.css">
  <link rel="stylesheet" href="css/cv-templates.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
      <div class="brand-text">
        <h1>Profile Craft</h1>
        <span>Portfolio & CV Builder</span>
      </div>
    </a>

    <div class="step-indicator">
      <div class="step-item completed"><span class="step-num"><i class="fa-solid fa-check"></i></span> Setup</div>
      <div class="step-divider"></div>
      <div class="step-item completed"><span class="step-num"><i class="fa-solid fa-check"></i></span> Template</div>
      <div class="step-divider"></div>
      <div class="step-item active"><span class="step-num">3</span> Fill Details</div>
      <div class="step-divider"></div>
      <div class="step-item"><span class="step-num">4</span> Output</div>
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn btn-sm" id="fillSampleBtn" title="Load sample data"><i class="fa-solid fa-bolt"></i> Sample Data</button>
      <a href="output.html" class="btn btn-accent btn-sm"><i class="fa-solid fa-eye"></i> View Final Output →</a>
    </div>
  </nav>

  <!-- BUILDER LAYOUT -->
  <div class="builder-layout">
    
    <!-- LEFT SIDEBAR EDITOR -->
    <aside class="builder-sidebar">
      <nav class="builder-tabs">
        <button class="tab-btn active" data-tab="tabPersonal"><i class="fa-solid fa-user"></i> Personal</button>
        <button class="tab-btn" data-tab="tabProjects"><i class="fa-solid fa-layer-group"></i> Projects</button>
        <button class="tab-btn" data-tab="tabExperience"><i class="fa-solid fa-building-user"></i> Experience</button>
        <button class="tab-btn" data-tab="tabEducation"><i class="fa-solid fa-graduation-cap"></i> Education</button>
        <button class="tab-btn" data-tab="tabSkills"><i class="fa-solid fa-code"></i> Skills</button>
      </nav>

      <div class="builder-form-content">

        <!-- PERSONAL TAB -->
        <div class="tab-pane active" id="tabPersonal">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" class="form-control">
          </div>
          <div class="form-group">
            <label>Professional Role / Title</label>
            <input type="text" id="jobTitle" class="form-control">
          </div>
          <div class="row-2">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="email" class="form-control">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="phone" class="form-control">
            </div>
          </div>
          <div class="row-2">
            <div class="form-group">
              <label>Location</label>
              <input type="text" id="location" class="form-control">
            </div>
            <div class="form-group">
              <label>Website</label>
              <input type="url" id="website" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label>Avatar / Photo Image URL</label>
            <input type="url" id="avatarUrl" class="form-control">
          </div>
          <div class="form-group">
            <label>Summary / Bio</label>
            <textarea id="summary" class="form-control" rows="3"></textarea>
          </div>
        </div>

        <!-- PROJECTS TAB -->
        <div class="tab-pane" id="tabProjects">
          <div id="projectsList" class="dynamic-list"></div>
          <button class="btn btn-primary" id="addProjectBtn" style="width:100%;"><i class="fa-solid fa-plus"></i> Add Project</button>
        </div>

        <!-- EXPERIENCE TAB -->
        <div class="tab-pane" id="tabExperience">
          <div id="experienceList" class="dynamic-list"></div>
          <button class="btn btn-primary" id="addExperienceBtn" style="width:100%;"><i class="fa-solid fa-plus"></i> Add Experience</button>
        </div>

        <!-- EDUCATION TAB -->
        <div class="tab-pane" id="tabEducation">
          <div id="educationList" class="dynamic-list"></div>
          <button class="btn btn-primary" id="addEducationBtn" style="width:100%;"><i class="fa-solid fa-plus"></i> Add Education</button>
        </div>

        <!-- SKILLS TAB -->
        <div class="tab-pane" id="tabSkills">
          <div id="skillsList" class="dynamic-list"></div>
          <button class="btn btn-primary" id="addSkillBtn" style="width:100%;"><i class="fa-solid fa-plus"></i> Add Skill</button>
        </div>

      </div>
    </aside>

    <!-- RIGHT LIVE SPLIT PREVIEW -->
    <main class="builder-preview-area">
      <div class="preview-bar">
        <span style="font-size:0.85rem; color:var(--text-muted); font-weight:600;"><i class="fa-solid fa-eye"></i> Live Split Preview</span>
        <a href="output.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-arrow-right"></i> Proceed to Output</a>
      </div>

      <div class="preview-workspace">
        <div id="previewContainer" class="preview-container">
          <!-- Rendered live preview -->
        </div>
      </div>
    </main>

  </div>

  <!-- SCRIPTS -->
  <script src="js/sample-data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/storage.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let profile = AppStorage.getProfile();
      const mode = AppStorage.getMode();
      const templateId = AppStorage.getTemplate();

      // Elements
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabPanes = document.querySelectorAll('.tab-pane');
      const previewContainer = document.getElementById('previewContainer');

      const inputFullName = document.getElementById('fullName');
      const inputJobTitle = document.getElementById('jobTitle');
      const inputEmail = document.getElementById('email');
      const inputPhone = document.getElementById('phone');
      const inputLocation = document.getElementById('location');
      const inputWebsite = document.getElementById('website');
      const inputAvatarUrl = document.getElementById('avatarUrl');
      const inputSummary = document.getElementById('summary');

      const projectsList = document.getElementById('projectsList');
      const experienceList = document.getElementById('experienceList');
      const educationList = document.getElementById('educationList');
      const skillsList = document.getElementById('skillsList');

      // Tab Switcher
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          tabPanes.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });

      function saveAndRender() {
        AppStorage.saveProfile(profile);
        renderLivePreview();
      }

      function renderLivePreview() {
        if (mode === 'portfolio') {
          previewContainer.innerHTML = TemplateGenerators.renderPortfolio(profile, templateId);
        } else {
          previewContainer.innerHTML = TemplateGenerators.renderCV(profile, templateId);
        }
      }

      function populateForm() {
        const p = profile.personal || {};
        inputFullName.value = p.fullName || '';
        inputJobTitle.value = p.jobTitle || '';
        inputEmail.value = p.email || '';
        inputPhone.value = p.phone || '';
        inputLocation.value = p.location || '';
        inputWebsite.value = p.website || '';
        inputAvatarUrl.value = p.avatarUrl || '';
        inputSummary.value = p.summary || '';

        renderProjects();
        renderExperience();
        renderEducation();
        renderSkills();
      }

      [inputFullName, inputJobTitle, inputEmail, inputPhone, inputLocation, inputWebsite, inputAvatarUrl, inputSummary].forEach(input => {
        input.addEventListener('input', () => {
          profile.personal[input.id] = input.value;
          saveAndRender();
        });
      });

      // Projects
      function renderProjects() {
        projectsList.innerHTML = '';
        (profile.projects || []).forEach((proj, idx) => {
          const card = document.createElement('div');
          card.className = 'dynamic-card';
          card.innerHTML = `
            <div class="card-top">
              <span class="card-title">Project #${idx + 1}</span>
              <button class="btn-icon-danger del-btn">&times;</button>
            </div>
            <div class="form-group"><label>Title</label><input type="text" class="form-control title-in" value="${proj.title || ''}"></div>
            <div class="form-group"><label>Description</label><textarea class="form-control desc-in">${proj.description || ''}</textarea></div>
            <div class="form-group"><label>Tags (comma separated)</label><input type="text" class="form-control tags-in" value="${proj.tags || ''}"></div>
          `;
          card.querySelector('.del-btn').addEventListener('click', () => { profile.projects.splice(idx, 1); saveAndRender(); renderProjects(); });
          card.querySelector('.title-in').addEventListener('input', (e) => { profile.projects[idx].title = e.target.value; saveAndRender(); });
          card.querySelector('.desc-in').addEventListener('input', (e) => { profile.projects[idx].description = e.target.value; saveAndRender(); });
          card.querySelector('.tags-in').addEventListener('input', (e) => { profile.projects[idx].tags = e.target.value; saveAndRender(); });
          projectsList.appendChild(card);
        });
      }
      document.getElementById('addProjectBtn').addEventListener('click', () => {
        profile.projects.push({ title: 'New Project', description: '', tags: 'HTML, JS' });
        saveAndRender(); renderProjects();
      });

      // Experience
      function renderExperience() {
        experienceList.innerHTML = '';
        (profile.experience || []).forEach((exp, idx) => {
          const card = document.createElement('div');
          card.className = 'dynamic-card';
          card.innerHTML = `
            <div class="card-top">
              <span class="card-title">Experience #${idx + 1}</span>
              <button class="btn-icon-danger del-btn">&times;</button>
            </div>
            <div class="row-2">
              <div class="form-group"><label>Company</label><input type="text" class="form-control comp-in" value="${exp.company || ''}"></div>
              <div class="form-group"><label>Role</label><input type="text" class="form-control pos-in" value="${exp.position || ''}"></div>
            </div>
            <div class="form-group"><label>Description</label><textarea class="form-control desc-in">${exp.description || ''}</textarea></div>
          `;
          card.querySelector('.del-btn').addEventListener('click', () => { profile.experience.splice(idx, 1); saveAndRender(); renderExperience(); });
          card.querySelector('.comp-in').addEventListener('input', (e) => { profile.experience[idx].company = e.target.value; saveAndRender(); });
          card.querySelector('.pos-in').addEventListener('input', (e) => { profile.experience[idx].position = e.target.value; saveAndRender(); });
          card.querySelector('.desc-in').addEventListener('input', (e) => { profile.experience[idx].description = e.target.value; saveAndRender(); });
          experienceList.appendChild(card);
        });
      }
      document.getElementById('addExperienceBtn').addEventListener('click', () => {
        profile.experience.push({ company: 'Company', position: 'Developer', description: '' });
        saveAndRender(); renderExperience();
      });

      // Education
      function renderEducation() {
        educationList.innerHTML = '';
        (profile.education || []).forEach((edu, idx) => {
          const card = document.createElement('div');
          card.className = 'dynamic-card';
          card.innerHTML = `
            <div class="card-top">
              <span class="card-title">Education #${idx + 1}</span>
              <button class="btn-icon-danger del-btn">&times;</button>
            </div>
            <div class="form-group"><label>Institution</label><input type="text" class="form-control inst-in" value="${edu.institution || ''}"></div>
            <div class="row-2">
              <div class="form-group"><label>Degree</label><input type="text" class="form-control deg-in" value="${edu.degree || ''}"></div>
              <div class="form-group"><label>Year</label><input type="text" class="form-control yr-in" value="${edu.year || ''}"></div>
            </div>
          `;
          card.querySelector('.del-btn').addEventListener('click', () => { profile.education.splice(idx, 1); saveAndRender(); renderEducation(); });
          card.querySelector('.inst-in').addEventListener('input', (e) => { profile.education[idx].institution = e.target.value; saveAndRender(); });
          card.querySelector('.deg-in').addEventListener('input', (e) => { profile.education[idx].degree = e.target.value; saveAndRender(); });
          card.querySelector('.yr-in').addEventListener('input', (e) => { profile.education[idx].year = e.target.value; saveAndRender(); });
          educationList.appendChild(card);
        });
      }
      document.getElementById('addEducationBtn').addEventListener('click', () => {
        profile.education.push({ institution: 'University', degree: 'B.S.', year: '2022' });
        saveAndRender(); renderEducation();
      });

      // Skills
      function renderSkills() {
        skillsList.innerHTML = '';
        (profile.skills || []).forEach((skill, idx) => {
          const card = document.createElement('div');
          card.className = 'dynamic-card';
          card.style.padding = '0.5rem';
          card.innerHTML = `
            <div style="display:flex; gap:8px;">
              <input type="text" class="form-control name-in" value="${skill.name || ''}" placeholder="Skill">
              <button class="btn-icon-danger del-btn">&times;</button>
            </div>
          `;
          card.querySelector('.del-btn').addEventListener('click', () => { profile.skills.splice(idx, 1); saveAndRender(); renderSkills(); });
          card.querySelector('.name-in').addEventListener('input', (e) => { profile.skills[idx].name = e.target.value; saveAndRender(); });
          skillsList.appendChild(card);
        });
      }
      document.getElementById('addSkillBtn').addEventListener('click', () => {
        profile.skills.push({ name: 'New Skill' });
        saveAndRender(); renderSkills();
      });

      document.getElementById('fillSampleBtn').addEventListener('click', () => {
        profile = JSON.parse(JSON.stringify(SAMPLE_PROFILES.developer));
        populateForm();
        saveAndRender();
      });

      populateForm();
      renderLivePreview();
    });
  </script>
</body>
</html>
